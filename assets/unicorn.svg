  <polygon points="42,58 50,28 58,58" fill="#ffd700" opacity="0.9"/>
  <polygon points="44,58 50,32 56,58" fill="#ffec6e"/>
  <!-- Eye -->
  <circle cx="47" cy="74" r="4" fill="#6a0dad"/>
  <circle cx="46" cy="73" r="1.5" fill="white"/>
  <!-- Mane -->
  <path d="M62 60 Q70 50 65 40 Q75 48 72 60 Q80 50 78 38 Q88 48 84 62 Q90 52 88 42" stroke="#c084fc" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M62 60 Q70 50 65 40 Q75 48 72 60 Q80 50 78 38 Q88 48 84 62 Q90 52 88 42" stroke="#f472b6" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Legs -->
  <rect x="72" y="158" width="10" height="30" rx="4" fill="#e9d5ff"/>
  <rect x="90" y="158" width="10" height="30" rx="4" fill="#e9d5ff"/>
  <rect x="108" y="158" width="10" height="30" rx="4" fill="#e9d5ff"/>
  <rect x="126" y="158" width="10" height="30" rx="4" fill="#e9d5ff"/>
  <!-- Hooves -->
  <rect x="72" y="183" width="10" height="7" rx="2" fill="#a855f7"/>
  <rect x="90" y="183" width="10" height="7" rx="2" fill="#a855f7"/>
  <rect x="108" y="183" width="10" height="7" rx="2" fill="#a855f7"/>
  <rect x="126" y="183" width="10" height="7" rx="2" fill="#a855f7"/>
  <!-- Tail -->
  <path d="M152 130 Q175 110 170 90 Q185 108 178 130 Q190 112 185 95" stroke="#c084fc" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M152 130 Q175 110 170 90 Q185 108 178 130 Q190 112 185 95" stroke="#f472b6" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Stars -->
  <text x="20" y="40" font-size="16" fill="#ffd700" opacity="0.8">★</text>
  <text x="160" y="55" font-size="12" fill="#c084fc" opacity="0.8">★</text>
  <text x="140" y="25" font-size="10" fill="#f472b6" opacity="0.7">✦</text>
  <text x="30" y="160" font-size="10" fill="#ffd700" opacity="0.6">✦</text>
