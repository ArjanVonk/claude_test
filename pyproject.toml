[project]
name = "imbalance-dashboard"
version = "0.1.0"
description = "Streamlit dashboard for Belgian imbalance prices"
requires-python = ">=3.11"
dependencies = [
    "pandas>=3.0.2",
    "plotly>=6.6.0",
    "psycopg2-binary>=2.9",
    "streamlit>=1.56.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/imbalance_dashboard"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
